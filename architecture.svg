<svg width="900" height="780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="780" fill="#f5f6fa" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">Spotnik Bulk Status Updater — System Architecture</text>

  <!-- ───── MONDAY.COM INTERFACE LAYER ───── -->
  <rect x="30" y="55" width="840" height="70" rx="10" fill="#f0e6ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="450" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">monday.com Interface</text>
  <rect x="120" y="80" width="220" height="34" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="230" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">Board App (iframe)</text>
  <text x="230" y="108" text-anchor="middle" font-size="10" fill="#555">React app embedded in monday board</text>
  <rect x="370" y="80" width="220" height="34" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="480" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">Developer Center</text>
  <text x="480" y="108" text-anchor="middle" font-size="10" fill="#555">App installed → localhost:5174 (dev mode)</text>
  <rect x="620" y="80" width="200" height="34" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="720" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">monday-sdk-js</text>
  <text x="720" y="108" text-anchor="middle" font-size="10" fill="#555">sessionToken · board context</text>

  <!-- ───── FRONTEND BOX ───── -->
  <rect x="30" y="140" width="260" height="340" rx="10" fill="#e8f0fe" stroke="#4a7ae8" stroke-width="2"/>
  <rect x="30" y="140" width="260" height="36" rx="10" fill="#4a7ae8"/>
  <rect x="30" y="164" width="260" height="12" fill="#4a7ae8"/>
  <text x="160" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Frontend (React + Vite)</text>

  <!-- monday-sdk-js -->
  <rect x="50" y="188" width="220" height="36" rx="6" fill="#fff" stroke="#4a7ae8" stroke-width="1.2"/>
  <text x="160" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7ae8">monday-sdk-js</text>
  <text x="160" y="217" text-anchor="middle" font-size="10" fill="#555">Board context detection</text>

  <!-- ConfigurationPanel -->
  <rect x="50" y="238" width="220" height="90" rx="6" fill="#fff" stroke="#4a7ae8" stroke-width="1.2"/>
  <text x="160" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7ae8">ConfigurationPanel</text>
  <text x="160" y="269" text-anchor="middle" font-size="10" fill="#555">• Board / Column selector</text>
  <text x="160" y="283" text-anchor="middle" font-size="10" fill="#555">• Filter (optional)</text>
  <text x="160" y="297" text-anchor="middle" font-size="10" fill="#555">• Preview item count</text>
  <text x="160" y="311" text-anchor="middle" font-size="10" fill="#555">• New value + Start button</text>

  <!-- ProgressIndicator -->
  <rect x="50" y="342" width="220" height="76" rx="6" fill="#fff" stroke="#4a7ae8" stroke-width="1.2"/>
  <text x="160" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7ae8">ProgressIndicator</text>
  <text x="160" y="373" text-anchor="middle" font-size="10" fill="#555">• Polls /jobs/:id every 1s</text>
  <text x="160" y="387" text-anchor="middle" font-size="10" fill="#555">• Real-time progress bar</text>
  <text x="160" y="401" text-anchor="middle" font-size="10" fill="#555">• Processed / failed counts</text>

  <!-- api.js -->
  <rect x="50" y="432" width="220" height="34" rx="6" fill="#fff" stroke="#4a7ae8" stroke-width="1.2"/>
  <text x="160" y="453" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7ae8">api.js (axios)</text>

  <!-- ───── BACKEND BOX ───── -->
  <rect x="330" y="140" width="280" height="480" rx="10" fill="#e6f9f0" stroke="#27ae60" stroke-width="2"/>
  <rect x="330" y="140" width="280" height="36" rx="10" fill="#27ae60"/>
  <rect x="330" y="164" width="280" height="12" fill="#27ae60"/>
  <text x="470" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Backend (Python + FastAPI)</text>

  <!-- REST Endpoints -->
  <rect x="350" y="188" width="240" height="130" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="470" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">REST Endpoints</text>
  <text x="370" y="219" font-size="10" fill="#555">GET  /boards</text>
  <text x="370" y="233" font-size="10" fill="#555">GET  /boards/:id/columns</text>
  <text x="370" y="247" font-size="10" fill="#555">POST /preview-count</text>
  <text x="370" y="261" font-size="10" fill="#555">POST /jobs  → returns job_id instantly</text>
  <text x="370" y="275" font-size="10" fill="#555">GET  /jobs/:id</text>
  <text x="370" y="289" font-size="10" fill="#555">POST /jobs/:id/cancel</text>

  <!-- Job Store -->
  <rect x="350" y="332" width="110" height="120" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="405" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Job Store</text>
  <text x="405" y="362" text-anchor="middle" font-size="10" fill="#888">(in-memory)</text>
  <text x="365" y="377" font-size="10" fill="#555">• status</text>
  <text x="365" y="391" font-size="10" fill="#555">• total</text>
  <text x="365" y="405" font-size="10" fill="#555">• processed</text>
  <text x="365" y="419" font-size="10" fill="#555">• failed</text>
  <text x="365" y="433" font-size="10" fill="#555">• cancel flag</text>

  <!-- Background Worker -->
  <rect x="470" y="332" width="120" height="180" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="530" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Background</text>
  <text x="530" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Worker</text>
  <text x="480" y="378" font-size="10" fill="#555">1. Fetch page</text>
  <text x="480" y="392" font-size="10" fill="#555">   (500 items)</text>
  <text x="480" y="406" font-size="10" fill="#555">2. Batch (50)</text>
  <text x="480" y="420" font-size="10" fill="#555">3. 2 parallel</text>
  <text x="480" y="434" font-size="10" fill="#555">4. Pipeline</text>
  <text x="480" y="448" font-size="10" fill="#555">5. Retry (3x)</text>
  <text x="480" y="462" font-size="10" fill="#555">6. Next page</text>
  <text x="480" y="476" font-size="10" fill="#555">7. Repeat</text>

  <!-- monday_client -->
  <rect x="350" y="526" width="240" height="76" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="470" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">monday_client.py</text>
  <text x="470" y="557" text-anchor="middle" font-size="10" fill="#555">• GraphQL query builder</text>
  <text x="370" y="571" font-size="10" fill="#555">• 429 retry (Retry-After header)</text>
  <text x="370" y="585" font-size="10" fill="#555">• Complexity retry (reset_in_x_seconds)</text>

  <!-- ───── MONDAY API BOX ───── -->
  <rect x="650" y="140" width="220" height="340" rx="10" fill="#fef3e8" stroke="#e67e22" stroke-width="2"/>
  <rect x="650" y="140" width="220" height="36" rx="10" fill="#e67e22"/>
  <rect x="650" y="164" width="220" height="12" fill="#e67e22"/>
  <text x="760" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="white">monday.com API</text>

  <rect x="668" y="188" width="184" height="42" rx="6" fill="#fff" stroke="#e67e22" stroke-width="1.2"/>
  <text x="760" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">boards()</text>
  <text x="760" y="219" text-anchor="middle" font-size="10" fill="#555">Fetch boards &amp; columns</text>

  <rect x="668" y="242" width="184" height="58" rx="6" fill="#fff" stroke="#e67e22" stroke-width="1.2"/>
  <text x="760" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">items_page()</text>
  <text x="760" y="273" text-anchor="middle" font-size="10" fill="#555">First page, 500 items</text>
  <text x="760" y="287" text-anchor="middle" font-size="10" fill="#555">+ cursor for next page</text>

  <rect x="668" y="312" width="184" height="42" rx="6" fill="#fff" stroke="#e67e22" stroke-width="1.2"/>
  <text x="760" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">next_items_page()</text>
  <text x="760" y="343" text-anchor="middle" font-size="10" fill="#555">Subsequent pages via cursor</text>

  <rect x="668" y="366" width="184" height="58" rx="6" fill="#fff" stroke="#e67e22" stroke-width="1.2"/>
  <text x="760" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">change_simple_column_</text>
  <text x="760" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">value() × 50</text>
  <text x="760" y="411" text-anchor="middle" font-size="10" fill="#555">Aliased batch mutations</text>

  <!-- ───── ARROWS ───── -->

  <!-- monday interface → Frontend (iframe) -->
  <line x1="230" y1="114" x2="160" y2="140" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)" stroke-dasharray="5,3"/>

  <!-- Frontend api.js → Backend -->
  <line x1="290" y1="449" x2="330" y2="449" stroke="#4a7ae8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="310" y="442" text-anchor="middle" font-size="9" fill="#4a7ae8">HTTP</text>

  <!-- Backend → monday API -->
  <line x1="610" y1="360" x2="650" y2="360" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="630" y="353" text-anchor="middle" font-size="9" fill="#27ae60">GraphQL</text>

  <!-- Job Store ↔ Worker -->
  <line x1="460" y1="390" x2="470" y2="390" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowGreen)" marker-start="url(#arrowGreenR)"/>

  <!-- ───── LEGEND ───── -->
  <rect x="30" y="510" width="260" height="110" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  <text x="160" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Key flows</text>
  <text x="44" y="546" font-size="10" fill="#555">1. User configures → preview count shown</text>
  <text x="44" y="561" font-size="10" fill="#555">2. Start → job_id returned in ms</text>
  <text x="44" y="576" font-size="10" fill="#555">3. Worker paginates &amp; batches mutations</text>
  <text x="44" y="591" font-size="10" fill="#555">4. Pipeline: fetch page N+1 while updating N</text>
  <text x="44" y="606" font-size="10" fill="#555">5. Frontend polls every 1s → live progress</text>

  <!-- ───── LOCAL DEV NOTE ───── -->
  <rect x="650" y="510" width="220" height="80" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="760" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">Local Dev Setup</text>
  <text x="760" y="545" text-anchor="middle" font-size="10" fill="#555">Frontend: localhost:5174</text>
  <text x="760" y="559" text-anchor="middle" font-size="10" fill="#555">Backend:  localhost:8001</text>
  <text x="760" y="573" text-anchor="middle" font-size="10" fill="#555">App URL set in Developer Center</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a7ae8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
    <marker id="arrowGreenR" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

</svg>
